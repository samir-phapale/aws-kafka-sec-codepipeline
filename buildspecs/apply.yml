version: 0.2

env:
  # Passed to the Integration stage.
  exported-variables:
    - INSTANCE_ID
    - TOPIC_NAME
    - SECRET_ARN

phases:
  install:
    commands:
      - bash scripts/ci/install-tools.sh terraform
  build:
    commands:
      - bash scripts/ci/tf-init.sh
      - terraform apply -input=false -no-color tfplan
      - export INSTANCE_ID="$(terraform output -raw instance_id)"
      - export TOPIC_NAME="$(terraform output -raw kafka_topic_name)"
      - export SECRET_ARN="$(terraform output -raw phase3_secret_arn)"
