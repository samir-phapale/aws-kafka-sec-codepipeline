# TF_PLAN_ARGS is "-destroy" in the destroy pipeline.
version: 0.2

phases:
  install:
    commands:
      - bash scripts/ci/install-tools.sh terraform conftest
  build:
    commands:
      - bash scripts/ci/tf-init.sh
      - terraform plan -input=false -no-color ${TF_PLAN_ARGS:-} -out=tfplan
      - terraform show -json tfplan > plan.json
      - conftest test plan.json --policy policy --all-namespaces --no-color

# Apply needs tfplan, the Lambda zips built during plan and the lock file.
# plan.json contains sensitive values, so it stays in this build.
artifacts:
  files:
    - "**/*"
    - .terraform.lock.hcl
  exclude-paths:
    - ".terraform/**/*"
    - plan.json
